<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vision AI Assistant</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body { background: #121212; color: #fff; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px; }
    button { background: #007aff; color: #fff; border: none; padding: 16px 32px; font-size: 18px; border-radius: 12px; margin-top: 20px; font-weight: bold; width: 80%; }
    select { margin: 10px; padding: 12px; border-radius: 8px; width: 80%; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; }
    #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    audio { display: none; }
  </style>

  <!-- 修正：指定 LiveKit Client 完整 bundle 路徑 -->
  <script src="https://unpkg.com/livekit-client@1.15.1/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <h2>👓 Vision AI Assistant</h2>

  <label for="video-select">相機來源：</label><br>
  <select id="video-select">
    <option value="">請點擊選擇相機</option>
  </select><br><br>

  <label for="audio-select">麥克風來源：</label><br>
  <select id="audio-select">
    <option value="">請點擊選擇麥克風</option>
  </select><br><br>

  <button id="connect-btn">連線至 AI 助理</button>
  <p id="status">狀態：尚未連線</p>

  <audio id="remote-audio" autoplay></audio>

  <script src="app.js" defer></script>
</body>
</html>
